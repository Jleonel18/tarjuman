name: Nightly live

# Behavioral checks against the real model (001 T148, quickstart §3): the guardrail suite (SC-003)
# and the behavioral red-team layer. Each suite runs every case under every tone itself, and its
# report gives the rates per tone. It spends the project-owned test key, so it runs on a schedule
# and on demand, never on pull requests.
#
# The key is read from the CI secret `TARJUMAN_TEST_KEY` and only passed as an environment variable
# to the two steps that need it. Nothing here prints it: no `set -x`, no echo of the environment,
# and GitHub also masks secret values in logs. Without the secret the job says so and stops.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check for the test key
        id: key
        env:
          TARJUMAN_TEST_KEY: ${{ secrets.TARJUMAN_TEST_KEY }}
        run: |
          if [ -z "$TARJUMAN_TEST_KEY" ]; then
            echo "::notice::TARJUMAN_TEST_KEY is not configured; skipping the live suites."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Guardrails against Claude, every tone (SC-003)
        if: steps.key.outputs.present == 'true'
        env:
          TARJUMAN_PROVIDER: anthropic
          TARJUMAN_TEST_KEY: ${{ secrets.TARJUMAN_TEST_KEY }}
        run: pnpm test:live:guardrails
      - name: Behavioral red-team against Claude, every tone
        # Runs even when the guardrail step failed, so one night reports both rates.
        if: ${{ !cancelled() && steps.key.outputs.present == 'true' }}
        env:
          TARJUMAN_PROVIDER: anthropic
          TARJUMAN_TEST_KEY: ${{ secrets.TARJUMAN_TEST_KEY }}
        run: pnpm test:live:redteam
