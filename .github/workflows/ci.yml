name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Required status check: adversarial and guardrail failures block merging (FR-037).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # lint:rules compares rule versions with the base branch, so it needs history.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:arch
      - run: pnpm lint:i18n
      - run: pnpm lint:rules
      - run: pnpm test
      - run: pnpm test:redteam
      - run: pnpm --filter @tarjuman/web build
      - run: pnpm check:bundle-origins
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
