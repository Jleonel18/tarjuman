name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Required status check: adversarial and guardrail failures block merging (FR-037).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint:rules compares rule versions with the base branch, so it needs history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:arch
      - run: pnpm lint:i18n
      - run: pnpm lint:rules
      - run: pnpm test
      - run: pnpm test:redteam
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
